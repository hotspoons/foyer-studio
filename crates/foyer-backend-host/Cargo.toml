[package]
name = "foyer-backend-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Generic IPC-based Backend. Speaks foyer-ipc to any conforming shim."

[dependencies]
foyer-schema.workspace = true
foyer-backend.workspace = true
foyer-ipc.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
futures.workspace = true
async-stream = "0.3"
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# Decoder for real waveform peaks — pure Rust, multi-format. Feature set
# matches common Ardour session exports: WAV/BWF/AIFF, FLAC, Vorbis in Ogg.
# Other codecs can be added behind optional symphonia features if needed.
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "pcm", "aiff", "vorbis", "ogg"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
futures.workspace = true
