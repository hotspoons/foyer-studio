[package]
name = "foyer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Foyer Studio CLI entrypoint."

[[bin]]
name = "foyer"
path = "src/main.rs"

[dependencies]
foyer-server = { workspace = true, default-features = true }
foyer-schema.workspace = true
foyer-backend.workspace = true
foyer-backend-stub.workspace = true
foyer-backend-host.workspace = true
foyer-config.workspace = true
foyer-snapshot.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "process"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Bundle web/ into the binary so a shipped `foyer` is self-contained.
# On first run the CLI extracts it to $XDG_DATA_HOME/foyer/web; users
# edit in place to hack (see web/HACKING.md). `--web-root <path>`
# overrides; `./web` takes precedence when it exists (dev mode).
include_dir = "0.7"
# MCP-probe + JSON-RPC body for the per-session port-up check. Same
# rustls-only build as the rest of the workspace.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# `libc::kill` for SIGTERM-vs-SIGKILL distinction in `ChildProcess`.
# `tokio::process::Child::kill()` always sends SIGKILL, which bypasses
# Ardour's save-and-exit handler — we need SIGTERM for the gentle
# stage of the close-session shutdown.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
