[package]
name = "foyer-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Foyer Studio user config file (backends, launcher defaults)."

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_yaml = "0.9"
anyhow.workspace = true
tracing.workspace = true
dirs       = "5"
foyer-schema.workspace = true
# clap::ValueEnum derive on DockerMode / DockerNetwork so foyer-cli's
# arg parser can take them directly. derive-only — no `Parser` API,
# we're not parsing argv from this crate.
clap       = { version = "4", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
tempfile   = "3"
