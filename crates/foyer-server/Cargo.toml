[package]
name = "foyer-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebSocket server + client fan-out. Library entrypoint is Server::run()."

[dependencies]
foyer-schema.workspace = true
foyer-capabilities.workspace = true
foyer-backend.workspace = true
foyer-agent.workspace = true
foyer-i18n.workspace = true
foyer-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
hostname = "0.4"
dirs = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.7", features = ["ws"] }
# TLS: pure-Rust via rustls. `axum-server` feature `tls-rustls`
# replaces `axum::serve` on the listening side; it uses `rustls` +
# `ring` under the hood — both static-link cleanly against musl
# (no openssl/libssl/libcrypto, no glibc dep). `default-features =
# false` would drop rustls-default crypto provider selection, so
# we keep defaults here and let the rustls ecosystem pick `ring`.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
# Project archive endpoints (`/sessions/upload`, `/sessions/export`).
# tar+gzip handles arbitrary directory trees with Unix metadata
# preserved (mode bits matter for sample/MIDI files referenced by
# .ardour XML). zip is supported on the upload path because that's
# what users get when they download a zip from a cloud bucket; we
# only ever emit tar.gz on the export path because it's lossless and
# universally available on the runtime side.
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# zstd: increasingly common as `tar.zst` (Arch packages, modern Linux
# tooling). Pure-Rust would be ideal but `zstd-rs` is the canonical
# binding to upstream zstandard and ships with the C source bundled —
# no system dep needed.
# default-features off: the only consumer is the streaming Decoder in
# archive.rs (tar.zst import path). The default `legacy` feature drags
# in the pre-1.0 zstd_v0x decoders, whose giant stack frames emit gcc
# stack-probe symbols (___chkstk_ms) that MSVC's link.exe can't
# resolve — it broke the Windows CI leg at link time (2026-07-10).
# Nobody has a 2015-era zstd archive to import.
zstd = { version = "0.13", default-features = false }
# Streaming XML scrubber for `.ardour` session files. Used post-
# extract to strip the `<Script>` blocks that Ardour's session
# loader auto-executes (RCE class) and to validate path-bearing
# attributes before the project lands in the jail. quick-xml does
# not expand entities by default, which sidesteps the
# billion-laughs concern from libxml2's XML_PARSE_HUGE.
quick-xml = "0.36"
# M6a audio egress pipeline: libopus bindings + foyer-audio resampler.
audiopus = { workspace = true }
foyer-audio.workspace = true
# Tunnel / remote-access support: token hashing, key generation, temp manifest writes.
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tempfile = "3"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
# Embedded tunnel providers (pure Rust, no external executables).
# WARNING: ngrok support is NOTIONAL / UNTESTED. It compiles and the code
# path is wired through `NgrokProvider`, but it has not been exercised end
# to end against a real ngrok account — cloudflared is the supported
# provider today. Left behind the `ngrok` feature flag so it can be
# revisited later without bit-rotting the code. Enable at your own risk:
#     cargo build -p foyer-server --features ngrok
ngrok = { version = "0.18", features = ["axum"], optional = true }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
foyer-config.workspace = true
open = "5"
urlencoding = "2"
# Explicit rustls with ring crypto provider to avoid runtime panic when
# multiple providers (ring + aws-lc-rs) are present in the dependency tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Headless renderer (gated). chromiumoxide drives a chromium subprocess
# via CDP. Optional so a build that disables `headless-render` doesn't
# pull this large dep tree in.
chromiumoxide = { version = "0.9", optional = true, default-features = false }
serde_urlencoded = { version = "0.7", optional = true }
# Cross-platform binary probe for headless chromium fallback paths.
# Gated behind `headless-render` so a slim build doesn't pull it in.
which = { version = "6", optional = true }

[features]
# Default ships with the headless-render path enabled — the
# `visualize` agent tool can spawn a chromium subprocess when no
# Foyer browser tab is attached. When chromium isn't installed the
# runtime call surfaces a clear install-hint instead of panicking,
# so the default-on choice is safe; disabling the feature is for
# slim builds (no chromiumoxide / tokio-tungstenite-ws dep tree).
default = ["headless-render"]
ngrok = ["dep:ngrok"]
headless-render = ["dep:chromiumoxide", "dep:serde_urlencoded", "dep:which"]

[dependencies.foyer-backend-stub]
# Used at runtime by the `Command::TestResetState` handler to mint a
# fresh launcher when Playwright resets per-spec. foyer-cli's launcher
# already drags this crate in for the bootstrap stub, so promoting it
# from `dev-dependencies` here adds nothing to the shipping binary.
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite = "0.24"
