{{- if .Values.config.create -}}
{{- $body := "" -}}
{{- if .Values.config.yamlOverride -}}
  {{- $body = .Values.config.yamlOverride -}}
{{- else -}}
  {{- $rendered := dict "server" .Values.config.defaults.server "jail" .Values.config.defaults.jail -}}
  {{- if .Values.config.tunnel -}}
    {{- $_ := set $rendered "tunnel" .Values.config.tunnel -}}
  {{- end -}}
  {{- if .Values.config.extra -}}
    {{- $_ := set $rendered "extra" .Values.config.extra -}}
  {{- end -}}
  {{- $body = toYaml $rendered -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foyer-studio.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foyer-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.yamlKey }}: |-
{{ $body | indent 4 }}
{{- end -}}
