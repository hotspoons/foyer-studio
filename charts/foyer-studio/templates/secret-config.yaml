{{- if .Values.config.create -}}
{{- $body := "" -}}
{{- if .Values.config.yamlOverride -}}
  {{- $body = .Values.config.yamlOverride -}}
{{- else -}}
  {{- /* deepCopy so the merge below doesn't mutate .Values.config.defaults
         (helm reuses it across template iterations). */ -}}
  {{- $rendered := .Values.config.defaults | deepCopy -}}
  {{- if .Values.config.tunnel -}}
    {{- $_ := set $rendered "tunnel" .Values.config.tunnel -}}
  {{- end -}}
  {{- if .Values.config.extra -}}
    {{- $rendered = mergeOverwrite $rendered .Values.config.extra -}}
  {{- end -}}
  {{- $body = toYaml $rendered -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foyer-studio.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foyer-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.yamlKey }}: |-
{{ $body | indent 4 }}
{{- end -}}
