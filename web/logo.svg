<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <style>
    .foyer-mark { fill: #8b5cf6; }
    .foyer-cap  { fill: #c4b5fd; }
    .foyer-rail { opacity: 0.35; }
    @media (prefers-color-scheme: dark) {
      .foyer-mark { fill: #a78bfa; }
      .foyer-cap  { fill: #ddd6fe; }
      /* Dark backgrounds eat the 35%-violet rails; bump to ~60% so
         the channel strip reads as three connected tracks instead
         of three floating caps + a baseline. */
      .foyer-rail { opacity: 0.6; }
    }
  </style>
  <!-- Three mixer fader tracks (rounded rails). -->
  <rect class="foyer-mark foyer-rail" x="170" y="140" width="60" height="520" rx="30"/>
  <rect class="foyer-mark foyer-rail" x="370" y="140" width="60" height="520" rx="30"/>
  <rect class="foyer-mark foyer-rail" x="570" y="140" width="60" height="520" rx="30"/>
  <!-- Fader caps at differing heights — sketches a "mix in motion". -->
  <rect class="foyer-cap" x="150" y="430" width="100" height="50" rx="14"/>
  <rect class="foyer-cap" x="350" y="260" width="100" height="50" rx="14"/>
  <rect class="foyer-cap" x="550" y="500" width="100" height="50" rx="14"/>
  <!-- Baseline / channel strip footer. -->
  <rect class="foyer-mark" x="140" y="690" width="520" height="40" rx="18"/>
</svg>
