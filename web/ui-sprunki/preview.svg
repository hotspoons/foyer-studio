<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="33%" stop-color="#feca57"/>
      <stop offset="66%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#ff9ff3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="48" fill="rgba(0,0,0,0.3)"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="rgba(255,255,255,0.08)"/>
  <text x="16" y="31" font-size="20" font-weight="800" fill="url(#title)" letter-spacing="1">🎵 Sprunki Beats</text>

  <!-- Tabs -->
  <rect x="660" y="10" width="54" height="28" rx="14" fill="rgba(108,92,231,0.3)" stroke="#6c5ce7" stroke-width="2"/>
  <text x="687" y="29" font-size="12" font-weight="600" fill="white" text-anchor="middle">Intro</text>
  <rect x="720" y="10" width="56" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
  <text x="748" y="29" font-size="12" font-weight="600" fill="#aaa" text-anchor="middle">Verse</text>
  <rect x="782" y="10" width="58" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
  <text x="811" y="29" font-size="12" font-weight="600" fill="#aaa" text-anchor="middle">Chorus</text>
  <rect x="846" y="10" width="52" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
  <text x="872" y="29" font-size="12" font-weight="600" fill="#aaa" text-anchor="middle">Drop</text>

