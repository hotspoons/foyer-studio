name: flatpak

# Build the Linux-native flatpak bundle (bundled Ardour + shim +
# foyer + foyer-desktop — see packaging/flatpak/). Produces a
# single-file `ai.patapsco.FoyerStudio.flatpak` artifact that
# installs with `flatpak install --user <file>`.
#
# Cost profile: the first build compiles Ardour from source
# (~30-40 min); the flatpak-builder cache keyed below keeps that
# module warm across runs, so steady-state builds only pay for the
# Rust workspace (~10 min). That's still too heavy for every branch
# push, so triggers are: merges to main, changes to the packaging
# tree itself on any branch, and manual dispatch.
#
# x86_64 only for now. The action can do aarch64 via QEMU but the
# Ardour compile balloons past the job limit — revisit with native
# arm64 runners if flatpak-on-arm demand shows up (the container
# image ships both arches).

on:
  push:
    branches: [main]
    paths:
      - 'packaging/flatpak/**'
      - 'crates/**'
      - 'shims/**'
      - 'web/**'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flatpak:
    name: build .flatpak bundle (x86_64)
    runs-on: ubuntu-24.04
    container:
      # Matches `runtime-version` in the manifest — bump together.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # flatpak-builder action from the Flathub infra team: installs
      # the runtime/SDK/extensions from Flathub, runs flatpak-builder
      # with a cached state dir, exports a single-file bundle, and
      # uploads it as a workflow artifact.
      # NB: the action's versioned tags (v6.x) live on the original
      # `flatpak/` org repo; the maintained container images live on
      # `flathub-infra` — mixed refs are correct, not a typo.
      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ai.patapsco.FoyerStudio.flatpak
          manifest-path: packaging/flatpak/ai.patapsco.FoyerStudio.yml
          # Ardour + deps only rebuild when the manifest (or a
          # vendored patch) changes; the cache key deliberately
          # ignores the Rust tree so cargo-only pushes reuse the
          # warm Ardour module.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
          arch: x86_64
          upload-artifact: true
          artifact-name: foyer-studio-flatpak-x86_64

      - name: Summary
        run: |
          {
            echo "## Flatpak bundle built"
            echo ""
            echo "Download the \`ai.patapsco.FoyerStudio.flatpak\` artifact, then:"
            echo ""
            echo '```bash'
            echo "flatpak install --user ai.patapsco.FoyerStudio.flatpak"
            echo "flatpak run ai.patapsco.FoyerStudio"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Publish: rolling GitHub Release ────────────────────────────────
  # Main merges re-point the `flatpak-latest` prerelease at the fresh
  # bundle, so there's one permanent URL to hand people:
  #
  #   https://github.com/<repo>/releases/download/flatpak-latest/ai.patapsco.FoyerStudio.flatpak
  #
  # Why a Release and not something fancier:
  #   * GHCR-OCI (truly "alongside the container image"): flatpak has
  #     native OCI support, but clients can't discover/install from a
  #     bare registry — that needs a flatpak index service (what
  #     Fedora runs in front of registry.fedoraproject.org). Without
  #     one, users end up downloading a file anyway.
  #   * ostree repo on GitHub Pages (real `flatpak update` deltas):
  #     this bundle is DAW-sized (bundled Ardour + LV2s) and would
  #     blow through Pages' ~1 GB soft limit almost immediately.
  #   * Releases: 2 GB/asset, stable URL, zero infra. Flathub remains
  #     the long-term channel once cargo sources are vendored — see
  #     DECISION 56.
  publish:
    name: publish rolling release (flatpak-latest)
    needs: flatpak
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: foyer-studio-flatpak-x86_64

      - name: Create or update flatpak-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Rolling flatpak build of \`main\` @ ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')).

          Install:
          \`\`\`bash
          flatpak install --user ai.patapsco.FoyerStudio.flatpak
          flatpak run ai.patapsco.FoyerStudio
          \`\`\`
          The GNOME runtime is fetched from Flathub automatically on first install
          (\`flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo\` if you've never used Flathub)."
          if gh release view flatpak-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit flatpak-latest --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Foyer Studio flatpak (rolling)" --notes "$notes"
          else
            gh release create flatpak-latest --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Foyer Studio flatpak (rolling)" --notes "$notes"
          fi
          # --clobber replaces the previous main build's asset so the
          # download URL never changes.
          gh release upload flatpak-latest ai.patapsco.FoyerStudio.flatpak \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::published ai.patapsco.FoyerStudio.flatpak to the flatpak-latest release"
